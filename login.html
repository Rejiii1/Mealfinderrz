<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sign in · MealFinderrz</title>
    <link rel="stylesheet" href="styles.css?v=26" />
    <link rel="manifest" href="manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meals" />
    <meta name="theme-color" content="#072444" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1626" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180x180.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          referrerpolicy="no-referrer" />
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-icon"><i class="fas fa-utensils"></i></div>
            <div>
                <h1>MealFinderrz</h1>
                <p class="subtitle">Plan tonight's dinner together.</p>
            </div>
        </div>

        <form id="loginForm" class="field" autocomplete="on">
            <div class="field">
                <label for="username">Username</label>
                <input class="input" type="text" id="username" name="username" required autofocus autocomplete="username" />
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input class="input" type="password" id="password" name="password" required autocomplete="current-password" />
            </div>
            <button class="btn btn-block btn-lg" type="submit" id="submitBtn">
                <i class="fas fa-sign-in-alt"></i> Sign in
            </button>
        </form>

        <p class="auth-footer">
            New here? <a href="/register">Create an account</a>
        </p>
    </div>

    <script type="module" src="login.js?v=26"></script>
</body>
</html>
